name: conalog_patch_map
description: Flutter package foundation for native PATCH MAP diagram rendering and interaction.
version: 1.0.0-alpha.1
# Enable publication only after the first functional release is qualified.
publish_to: none
homepage: https://github.com/Conalog/patch-map
repository: https://github.com/Conalog/patch-map/tree/release/1.0/packages/flutter
issue_tracker: https://github.com/Conalog/patch-map/issues
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: '>=2.2.4 <2.3.0'
  vector_graphics: '>=1.1.19 <1.2.0'
dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/icons/
    - assets/fonts/
