name: patch_map
description: Native Flutter Canvas renderer and controller for PATCH MAP datasets.
version: 0.1.0-alpha.1
homepage: https://github.com/Conalog/patch-map
repository: https://github.com/Conalog/patch-map/tree/release/1.0/packages/flutter
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_svg: '>=2.2.4 <2.3.0'
  vector_graphics: '>=1.1.19 <1.2.0'
  brotli: '>=0.6.0 <0.7.0'
  flutter_avif: '>=3.1.0 <3.2.0'
dev_dependencies:
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: false
  assets:
    - assets/icons/
    - assets/fonts/
