name: Feature request
description: Propose a PatchMap capability or integration improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Host problem
      description: What can the integrating service or map user not do today?
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Required observable behavior
      description: Include input shape, interaction, rendering, lifecycle, and failure expectations.
    validations:
      required: true
  - type: textarea
    id: scale
    attributes:
      label: Dataset and performance profile
      description: Typical/maximum entities, update cadence, browser/OS, and required backend.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
