name: Publish npm

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Select release/1.0 as the workflow ref to publish a js-v tag
        required: false
        type: string

permissions: {}

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Create or update legacy GitHub release
    if: ${{ github.ref == 'refs/heads/main' }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Require the npm release branch for publication
        if: ${{ inputs.tag != '' }}
        run: |
          echo "::error::Use the release/1.0 workflow ref to publish a js-v tag."
          exit 1

      - name: Create or update release pull request
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
