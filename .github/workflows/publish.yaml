name: Publish npm

on:
  push:
    branches:
      - release/1.0
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release/1.0 tag to validate and publish
        required: false
        type: string

permissions: {}

concurrency:
  group: release-1.0-npm
  # GitHub supports this queue; actionlint v1.7.12 has not added it to its schema yet.
  queue: max

jobs:
  release:
    name: Create or update release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      should_publish: ${{ steps.release.outputs.release_created == 'true' || steps.manual.outputs.tag_name != '' }}
      tag_name: ${{ steps.manual.outputs.tag_name || steps.release.outputs.tag_name }}
    steps:
      - name: Checkout release branch
        if: ${{ github.event_name == 'push' || inputs.tag == '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require release gate commands
        if: ${{ github.event_name == 'push' || inputs.tag == '' }}
        run: test "$(node .github/scripts/release-ready.mjs --require)" = true

      - name: Create or update release pull request
        id: release
        if: ${{ github.event_name == 'push' || inputs.tag == '' }}
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          target-branch: release/1.0
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Validate manually requested release tag
        id: manual
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
        env:
          TAG_NAME: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$TAG_NAME" =~ ^v1\.0\.0(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Only v1.0.0-alpha.*, v1.0.0-beta.*, v1.0.0-rc.*, or v1.0.0 may be published." >&2
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"

  metadata:
    name: Validate release tag
    needs: release
    if: ${{ needs.release.outputs.should_publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      dist-tag: ${{ steps.release.outputs.dist-tag }}
      package-version: ${{ steps.release.outputs.package-version }}
      release-kind: ${{ steps.release.outputs.release-kind }}
      release-sha: ${{ steps.release.outputs.release-sha }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Require release/1.0 ancestry
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/release/1.0:refs/remotes/origin/release/1.0
          git merge-base --is-ancestor HEAD refs/remotes/origin/release/1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate tag, package, and channel
        id: release
        env:
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        shell: bash
        run: |
          test -f package.json
          test -f package-lock.json
          test "$(node -p "require('./package.json').name")" = "@conalog/patch-map"
          test "$(node .github/scripts/release-ready.mjs)" = true

          package_version="$(node -p "require('./package.json').version")"
          test "$TAG_NAME" = "v$package_version"

          if [[ "$package_version" = "1.0.0" ]]; then
            dist_tag=latest
            release_kind=stable
          elif [[ "$package_version" =~ ^1\.0\.0-(alpha|beta|rc)\.[0-9]+$ ]]; then
            dist_tag=next
            release_kind=prerelease
          else
            echo "Only 1.0.0-alpha.*, 1.0.0-beta.*, 1.0.0-rc.*, or 1.0.0 may be published." >&2
            exit 1
          fi

          echo "dist-tag=$dist_tag" >> "$GITHUB_OUTPUT"
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"
          echo "release-kind=$release_kind" >> "$GITHUB_OUTPUT"
          echo "release-sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  product:
    name: Product and canonical contract
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.release-sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm run unit

      - name: Build package
        run: npm run build

      - name: Verify canonical contract
        run: npm run verify:contract

  packed-consumer:
    name: Packed consumer
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      package-sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.release-sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify packed ESM, CJS, types, and consumer audit
        env:
          PATCH_MAP_PACKAGE_ARTIFACT_DIR: .release-evidence
        run: npm run verify:package -- --require-audit

      - name: Create the verified release artifact
        id: package
        shell: bash
        run: |
          mkdir .release-artifact
          pack_json="$(npm pack --ignore-scripts --json --pack-destination .release-artifact)"
          filename="$(node -e 'process.stdout.write(JSON.parse(process.argv[1])[0].filename)' "$pack_json")"
          artifact_path=".release-artifact/$filename"
          test -f "$artifact_path"

          artifact_sha256="$(sha256sum "$artifact_path" | cut -d ' ' -f 1)"
          verified_sha256="$(node -p "require('./.release-evidence/package-consumer.json').provenance.packedPackageSha256")"
          test "$artifact_sha256" = "$verified_sha256"

          echo "sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload the verified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-${{ needs.metadata.outputs.release-sha }}
          path: .release-artifact/*.tgz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  browser-lifecycle:
    name: Headless Lab and lifecycle memory
    needs: metadata
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.release-sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build Lab
        run: npm run build:lab

      - name: Verify every headless Lab route
        run: npm run verify:lab:all

      - name: Verify lifecycle memory
        run: npm run verify:memory

  publish:
    name: Publish ${{ needs.metadata.outputs.package-version }} to npm ${{ needs.metadata.outputs.dist-tag }}
    needs:
      - metadata
      - product
      - packed-consumer
      - browser-lifecycle
    if: >-
      ${{
        vars.NPM_PUBLISH_ENABLED == 'true' &&
        (
          (needs.metadata.outputs.release-kind == 'prerelease' && vars.NPM_PRERELEASE_ENABLED == 'true') ||
          (needs.metadata.outputs.release-kind == 'stable' && vars.NPM_LATEST_ENABLED == 'true')
        )
      }}
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Setup Node for npm Trusted Publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require an OIDC-capable npm CLI
        shell: bash
        run: |
          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) {
              throw new Error("npm 11.5.1 or newer is required for Trusted Publishing");
            }
          ' "$npm_version"

      - name: Download the verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-${{ needs.metadata.outputs.release-sha }}
          path: release-artifact

      - name: Verify artifact digest and package metadata
        id: artifact
        env:
          EXPECTED_SHA256: ${{ needs.packed-consumer.outputs.package-sha256 }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}
        shell: bash
        run: |
          mapfile -t tarballs < <(find release-artifact -maxdepth 1 -type f -name '*.tgz')
          test "${#tarballs[@]}" -eq 1
          tarball="$(realpath "${tarballs[0]}")"

          actual_sha256="$(sha256sum "$tarball" | cut -d ' ' -f 1)"
          test "$actual_sha256" = "$EXPECTED_SHA256"

          package_json="$(tar -xOf "$tarball" package/package.json)"
          node -e '
            const manifest = JSON.parse(process.argv[1]);
            if (manifest.name !== "@conalog/patch-map") throw new Error("unexpected package name");
            if (manifest.version !== process.argv[2]) throw new Error("unexpected package version");
          ' "$package_json" "$PACKAGE_VERSION"

          local_integrity="$(node -e '
            const { createHash } = require("node:crypto");
            const { readFileSync } = require("node:fs");
            process.stdout.write(`sha512-${createHash("sha512").update(readFileSync(process.argv[1])).digest("base64")}`);
          ' "$tarball")"

          echo "integrity=$local_integrity" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Check registry publication state
        id: registry
        env:
          DIST_TAG: ${{ needs.metadata.outputs.dist-tag }}
          LOCAL_INTEGRITY: ${{ steps.artifact.outputs.integrity }}
          PACKAGE_VERSION: ${{ needs.metadata.outputs.package-version }}
        shell: bash
        run: |
          set +e
          registry_output="$(npm view "@conalog/patch-map@$PACKAGE_VERSION" version 2>&1)"
          registry_status=$?
          set -e

          if [[ $registry_status -eq 0 ]]; then
            registry_integrity="$(npm view "@conalog/patch-map@$PACKAGE_VERSION" dist.integrity)"
            tagged_version="$(npm view "@conalog/patch-map" "dist-tags.$DIST_TAG")"
            test "$registry_integrity" = "$LOCAL_INTEGRITY"
            test "$tagged_version" = "$PACKAGE_VERSION"
            echo "already-published=true" >> "$GITHUB_OUTPUT"
            echo "@conalog/patch-map@$PACKAGE_VERSION is already published on $DIST_TAG; nothing to do."
            exit 0
          fi

          if ! grep -q 'E404' <<< "$registry_output"; then
            echo "$registry_output" >&2
            echo "Could not establish that @conalog/patch-map@$PACKAGE_VERSION is unpublished." >&2
            exit 1
          fi

          dist_tags_json="$(npm view "@conalog/patch-map" dist-tags --json)"
          current_channel_version="$(node -e '
            const tags = JSON.parse(process.argv[1]);
            process.stdout.write(tags[process.argv[2]] ?? "");
          ' "$dist_tags_json" "$DIST_TAG")"

          node - "$PACKAGE_VERSION" "$DIST_TAG" "$current_channel_version" <<'NODE'
          const target = process.argv[2];
          const distTag = process.argv[3];
          const current = process.argv[4];
          if (!current) process.exit(0);

          const compareTriples = (left, right) => {
            for (let index = 0; index < left.length; index += 1) {
              if (left[index] !== right[index]) return left[index] - right[index];
            }
            return 0;
          };

          if (distTag === 'latest') {
            const parseStable = (version) => {
              const match = /^(\d+)\.(\d+)\.(\d+)$/.exec(version);
              if (!match) throw new Error(`latest points to unsupported version ${version}`);
              return match.slice(1).map(Number);
            };
            if (compareTriples(parseStable(target), parseStable(current)) <= 0) {
              throw new Error(`refusing to move latest backward from ${current} to ${target}`);
            }
            process.exit(0);
          }

          const phases = new Map([['alpha', 0], ['beta', 1], ['rc', 2]]);
          const parsePrerelease = (version) => {
            const match = /^1\.0\.0-(alpha|beta|rc)\.(\d+)$/.exec(version);
            if (!match) throw new Error(`next points to unsupported version ${version}`);
            return [phases.get(match[1]), Number(match[2])];
          };
          if (compareTriples(parsePrerelease(target), parsePrerelease(current)) <= 0) {
            throw new Error(`refusing to move next backward from ${current} to ${target}`);
          }
          NODE

          echo "already-published=false" >> "$GITHUB_OUTPUT"

      - name: Publish with the selected dist-tag
        if: ${{ steps.registry.outputs.already-published == 'false' }}
        env:
          DIST_TAG: ${{ needs.metadata.outputs.dist-tag }}
          TARBALL: ${{ steps.artifact.outputs.tarball }}
        run: npm publish "$TARBALL" --ignore-scripts --access public --tag "$DIST_TAG"
