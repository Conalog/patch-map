name: CI

on:
  pull_request:
    branches:
      - release/1.0

permissions:
  contents: read

concurrency:
  group: release-1.0-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      full_validation: ${{ steps.changes.outputs.full_validation }}
      flutter_validation: ${{ steps.changes.outputs.flutter_validation }}
    steps:
      - name: Checkout comparison base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Test release metadata and change classifier
        run: node --test .github/scripts/classify-ci-files.test.mjs .github/scripts/release-ready.test.mjs .github/scripts/release-metadata.test.mjs

      - name: Require release gate commands
        run: test "$(node .github/scripts/release-ready.mjs --require)" = true

      - name: Classify pull request changes
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          RESULT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          test "$(git rev-parse "$RESULT_SHA^1")" = "$BASE_SHA"
          node .github/scripts/classify-ci-files.mjs "$BASE_SHA" "$RESULT_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify documentation for changes outside npm
        if: ${{ steps.changes.outputs.full_validation == 'false' }}
        run: node verification/docs/verify.mjs

  gate:
    name: ${{ matrix.name }}
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: core
            name: Core
          - gate: package
            name: Package
          - gate: lifecycle
            name: Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        if: ${{ needs.classify.outputs.full_validation == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        if: ${{ needs.classify.outputs.full_validation == 'true' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: ${{ needs.classify.outputs.full_validation == 'true' }}
        run: npm ci

      - name: Release tooling
        if: ${{ matrix.gate == 'core' && needs.classify.outputs.full_validation == 'true' }}
        run: node --test .github/scripts/*.test.mjs verification/package-supply-chain.test.mjs

      - name: Typecheck
        if: ${{ matrix.gate == 'core' && needs.classify.outputs.full_validation == 'true' }}
        run: |
          npm run js:typecheck
          npm run verify:typecheck

      - name: Lint
        if: ${{ matrix.gate == 'core' && needs.classify.outputs.full_validation == 'true' }}
        run: |
          npm run js:lint
          npm run verify:lint

      - name: Unit
        if: ${{ matrix.gate == 'core' && needs.classify.outputs.full_validation == 'true' }}
        run: npm run js:unit

      - name: Build
        if: ${{ matrix.gate == 'core' && needs.classify.outputs.full_validation == 'true' }}
        run: npm run js:build

      - name: Documentation
        if: ${{ matrix.gate == 'core' && needs.classify.outputs.full_validation == 'true' }}
        run: npm run verify:docs

      - name: Install Chromium
        if: ${{ matrix.gate != 'core' && needs.classify.outputs.full_validation == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Verify package
        if: ${{ matrix.gate == 'package' && needs.classify.outputs.full_validation == 'true' }}
        run: npm run js:verify:package -- --require-audit

      - name: Verify memory
        if: ${{ matrix.gate == 'lifecycle' && needs.classify.outputs.full_validation == 'true' }}
        run: npm run js:verify:memory

      - name: Verify benchmark harness
        if: ${{ matrix.gate == 'lifecycle' && needs.classify.outputs.full_validation == 'true' }}
        run: npm run js:performance:smoke

  flutter:
    name: Flutter package
    needs: classify
    if: ${{ needs.classify.outputs.flutter_validation == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: 3.41.4
          channel: stable

      - name: Install dependencies
        run: |
          npm ci
          cd packages/flutter
          flutter pub get

      - name: Shared contracts and package boundaries
        run: |
          node verification/conformance/inventory.mjs
          node --test verification/conformance/*.test.mjs verification/flutter/installed-consumer.test.mjs
          node verification/conformance/run-data.mjs
          node verification/conformance/run-model.mjs
          node verification/conformance/run-text.mjs
          for binding in conformance/api-bindings/*.json; do
            node verification/conformance/api-bindings.mjs "$binding"
          done
          node verification/flutter/package.mjs

      - name: Dart analysis and tests
        working-directory: packages/flutter
        run: |
          flutter analyze --no-pub lib test
          flutter test --no-pub --concurrency=2

      - name: Compare npm and Dart public commands
        run: |
          npx playwright install --with-deps chromium
          node verification/conformance/run-public.mjs

      - name: Installed Dart consumer
        run: node verification/flutter/installed-consumer.mjs

  validation:
    name: CI
    if: ${{ always() }}
    needs: [classify, gate, flutter]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all gates
        env:
          CLASSIFIER_RESULT: ${{ needs.classify.result }}
          FULL_VALIDATION: ${{ needs.classify.outputs.full_validation }}
          GATES_RESULT: ${{ needs.gate.result }}
          FLUTTER_VALIDATION: ${{ needs.classify.outputs.flutter_validation }}
          FLUTTER_RESULT: ${{ needs.flutter.result }}
        run: |
          test "$CLASSIFIER_RESULT" = success
          test "$GATES_RESULT" = success
          test "$FULL_VALIDATION" = true || test "$FULL_VALIDATION" = false
          if test "$FLUTTER_VALIDATION" = true; then
            test "$FLUTTER_RESULT" = success
          else
            test "$FLUTTER_VALIDATION" = false
            test "$FLUTTER_RESULT" = skipped
          fi
