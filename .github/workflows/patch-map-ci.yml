name: Release 1.0 CI

on:
  pull_request:
    branches:
      - release/1.0

permissions:
  contents: read

concurrency:
  group: release-1.0-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - gate: core
            name: Core
          - gate: package
            name: Package
          - gate: browser
            name: Browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Mode
        id: mode
        shell: bash
        run: |
          if [[ "$(node .github/scripts/release-ready.mjs)" = true ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap package: product checks are waiting for the release scripts." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        if: ${{ matrix.gate == 'core' && steps.mode.outputs.ready == 'true' }}
        run: npm run typecheck

      - name: Lint
        if: ${{ matrix.gate == 'core' && steps.mode.outputs.ready == 'true' }}
        run: npm run lint

      - name: Unit
        if: ${{ matrix.gate == 'core' && steps.mode.outputs.ready == 'true' }}
        run: npm run unit

      - name: Build
        if: ${{ matrix.gate == 'core' && steps.mode.outputs.ready == 'true' }}
        run: npm run build

      - name: Contract
        if: ${{ matrix.gate == 'core' && steps.mode.outputs.ready == 'true' }}
        run: npm run verify:contract

      - name: Install Chromium
        if: ${{ matrix.gate != 'core' && steps.mode.outputs.ready == 'true' }}
        run: npx playwright install --with-deps chromium

      - name: Verify package
        if: ${{ matrix.gate == 'package' && steps.mode.outputs.ready == 'true' }}
        run: npm run verify:package -- --require-audit

      - name: Build Lab
        if: ${{ matrix.gate == 'browser' && steps.mode.outputs.ready == 'true' }}
        run: npm run build:lab

      - name: Verify Lab
        if: ${{ matrix.gate == 'browser' && steps.mode.outputs.ready == 'true' }}
        run: npm run verify:lab:all

      - name: Verify memory
        if: ${{ matrix.gate == 'browser' && steps.mode.outputs.ready == 'true' }}
        run: npm run verify:memory

  validation:
    name: CI
    if: ${{ always() }}
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all gates
        env:
          GATES_RESULT: ${{ needs.gate.result }}
        run: test "$GATES_RESULT" = success
