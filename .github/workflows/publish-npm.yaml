name: publish npm

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish package
    if: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
    environment: npm
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require a release tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_TYPE" = tag
          [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]

      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Setup Node for Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Require tag and package versions to match
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$TAG_NAME" = "v$package_version"

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium headless shell
        run: npx playwright install --with-deps --only-shell chromium

      - name: Verify release source
        run: |
          npm run check
          npm test
          npm run build
          npm run pack:check

      - name: Publish package
        run: npm publish --access public
