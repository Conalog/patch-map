name: release please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Create or update release
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Create or update release pull request
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Record disabled npm publication
        if: ${{ steps.release.outputs.release_created == 'true' && vars.NPM_PUBLISH_ENABLED != 'true' }}
        env:
          TAG_NAME: ${{ steps.release.outputs.tag_name }}
        run: |
          echo "### npm publication is disabled" >> "$GITHUB_STEP_SUMMARY"
          echo "Release $TAG_NAME was created without npm publication." >> "$GITHUB_STEP_SUMMARY"
          echo "After Trusted Publishing is configured, dispatch publish-npm.yaml at this tag." >> "$GITHUB_STEP_SUMMARY"

  dispatch_publish:
    name: Dispatch npm publication
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' && vars.NPM_PUBLISH_ENABLED == 'true' }}
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch publish workflow at release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.release.outputs.tag_name }}
        run: gh workflow run publish-npm.yaml --ref "$TAG_NAME"
