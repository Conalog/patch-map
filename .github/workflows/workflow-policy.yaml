name: Workflow Policy

on:
  pull_request:
    branches:
      - release/1.0
    paths:
      - .github/workflows/**
      - .github/scripts/**
      - .github/zizmor.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze GitHub Actions configuration
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          inputs: .github/workflows
          # Release cache findings are low-confidence on this push-only workflow.
          min-confidence: high
          version: v1.29.0
