name: Workflow Policy

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/scripts/**
      - .github/zizmor.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Analyze GitHub Actions configuration
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          advanced-security: false
          inputs: .github/workflows
          min-confidence: high
          version: v1.29.0
