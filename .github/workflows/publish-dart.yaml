name: Publish Dart

on:
  push:
    tags: ['dart-v[0-9]*']
  pull_request:
    branches: [release/1.0]
    paths:
      - .github/workflows/publish-dart.yaml
      - .github/scripts/dart-release.mjs
      - .github/scripts/pub-artifact.mjs
      - verification/flutter/renderer-qualification.mjs
      - packages/flutter/example/ios/Gemfile
      - packages/flutter/example/ios/Gemfile.lock

permissions: {}

concurrency:
  group: ${{ github.event_name == 'push' && 'release-1.0-dart' || github.ref }}
  queue: max

jobs:
  verify:
    name: Verify immutable Dart release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      release-sha: ${{ steps.identity.outputs.sha }}
      package-version: ${{ steps.metadata.outputs.package-version }}
    steps:
      - name: Checkout release inputs
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Identify source and verify tag ancestry
        id: identity
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            git fetch --no-tags origin +refs/heads/release/1.0:refs/remotes/origin/release/1.0
            git merge-base --is-ancestor HEAD refs/remotes/origin/release/1.0
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Read SDK role
        id: sdk
        run: node verification/flutter/toolchains.mjs ci >> "$GITHUB_OUTPUT"
      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.sdk.outputs.flutter-version }}
          channel: ${{ steps.sdk.outputs.flutter-channel }}
      - name: Verify installed SDK
        run: node verification/flutter/toolchains.mjs check ci
      - name: Validate package and tag
        id: metadata
        env:
          TAG_NAME: ${{ github.ref_name }}
          PUBLISH_ENABLED: ${{ vars.PUBDEV_PUBLISH_ENABLED }}
        run: |
          node .github/scripts/release-ready.mjs --scope dart
          if [ "$GITHUB_EVENT_NAME" != push ]; then exit 0; fi
          if [ "$PUBLISH_ENABLED" = true ]; then
            node .github/scripts/release-metadata.mjs dart "$TAG_NAME"
          else
            node .github/scripts/release-metadata.mjs dart "$TAG_NAME" --candidate
          fi
      - name: Install dependencies
        run: |
          npm ci --workspace verification --include-workspace-root=false --ignore-scripts
          node verification/assets/prepare.mjs flutter
          cd packages/flutter
          flutter pub get
      - name: Check Dart artifact
        run: |
          npm run flutter:analyze
          npm run flutter:test
          npm run flutter:verify:package
      - name: Verify installed consumer and prepare exact publication inputs
        run: node .github/scripts/dart-release.mjs prepare
      - name: Retain candidate and source snapshot for qualification
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dart-candidate-${{ steps.identity.outputs.sha }}
          path: .release-dart/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  renderer:
    name: Qualify Dart renderer (${{ matrix.platform }})
    needs: verify
    if: ${{ github.event_name == 'pull_request' || vars.PUBDEV_PUBLISH_ENABLED == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release-sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Read SDK role
        id: sdk
        run: node verification/flutter/toolchains.mjs ci >> "$GITHUB_OUTPUT"
      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.sdk.outputs.flutter-version }}
          channel: ${{ steps.sdk.outputs.flutter-channel }}
          cache: true
      - name: Verify installed SDK
        run: node verification/flutter/toolchains.mjs check ci
      - name: Prepare release assets and verifier dependencies
        run: |
          npm ci --workspace verification --include-workspace-root=false --ignore-scripts
          node verification/assets/prepare.mjs flutter
      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dart-candidate-${{ needs.verify.outputs.release-sha }}
          path: .release-dart
      - name: Enable Android emulator acceleration
        if: ${{ matrix.platform == 'android' }}
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - name: Run Android renderer checks
        if: ${{ matrix.platform == 'android' }}
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          emulator-port: 5554
          script: node verification/flutter/renderer-qualification.mjs android emulator-5554
      - name: Run iOS renderer checks
        if: ${{ matrix.platform == 'ios' }}
        env:
          BUNDLE_GEMFILE: ${{ github.workspace }}/packages/flutter/example/ios/Gemfile
          BUNDLE_PATH: ${{ runner.temp }}/patch-map-cocoapods
          BUNDLE_FROZEN: 'true'
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
          PATCH_MAP_RENDERER_VERBOSE: 'true'
        run: |
          xcodebuild -version
          bundle install
          version=$(awk '$1 == "COCOAPODS:" { print $2 }' packages/flutter/example/ios/Podfile.lock)
          installed=$(bundle exec pod --version)
          if [ "$installed" != "$version" ]; then
            echo "CocoaPods $installed does not match Podfile.lock ($version)" >&2
            exit 1
          fi
          echo "Using CocoaPods $installed from the iOS example lockfile"
          device=$(xcrun simctl list devices available --json | jq -er '
            [.devices["com.apple.CoreSimulator.SimRuntime.iOS-26-2"][]?
             | select(.isAvailable and .name == "iPhone 17 Pro")]
            | .[0].udid // error("iPhone 17 Pro with iOS 26.2 is unavailable")')
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          bundle exec node verification/flutter/renderer-qualification.mjs ios "$device"
      - name: Retain renderer test log
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dart-renderer-${{ matrix.platform }}-${{ needs.verify.outputs.release-sha }}
          path: .release-dart/${{ matrix.platform }}-renderer.*
          include-hidden-files: true
          retention-days: 30
          overwrite: true

  qualify:
    name: Qualify exact Dart package
    needs: [verify, renderer]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout exact candidate source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release-sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Prepare release assets and verifier dependencies
        run: |
          npm ci --workspace verification --include-workspace-root=false --ignore-scripts
          node verification/assets/prepare.mjs flutter
      - name: Download exact candidate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dart-candidate-${{ needs.verify.outputs.release-sha }}
          path: .release-dart
      - name: Download platform results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: dart-renderer-*-${{ needs.verify.outputs.release-sha }}
          path: .release-dart
          merge-multiple: true
      - name: Qualify the archive with both platform results
        run: node .github/scripts/dart-release.mjs collect
      - name: Retain qualified release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dart-qualified-${{ needs.verify.outputs.release-sha }}
          path: |
            .release-dart/conalog_patch_map.tar.gz
            .release-dart/installed-consumer.json
            .release-dart/compatibility.json
            .release-dart/dart-qualification.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish:
    name: Publish qualified Dart package
    needs: [verify, qualify]
    if: ${{ github.event_name == 'push' && vars.PUBDEV_PUBLISH_ENABLED == 'true' }}
    environment: pub.dev
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout verified release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.release-sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Read SDK role
        id: sdk
        run: node verification/flutter/toolchains.mjs ci >> "$GITHUB_OUTPUT"
      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.sdk.outputs.flutter-version }}
          channel: ${{ steps.sdk.outputs.flutter-channel }}
      - name: Configure pub.dev OIDC
        uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # pinned setup-dart v1
        with:
          sdk: ${{ steps.sdk.outputs.dart-version }}
      - name: Verify installed SDK
        run: node verification/flutter/toolchains.mjs check ci
      - name: Download qualified artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dart-qualified-${{ needs.verify.outputs.release-sha }}
          path: .release-dart
      - name: Verify and extract exact qualified package
        id: artifact
        run: node .github/scripts/pub-artifact.mjs extract
      - name: Check immutable registry version
        id: registry
        env:
          PACKAGE_VERSION: ${{ needs.verify.outputs.package-version }}
        run: node .github/scripts/pub-artifact.mjs registry
      - name: Publish exact qualified contents
        if: ${{ steps.registry.outputs.already-published == 'false' }}
        working-directory: ${{ steps.artifact.outputs.package-directory }}
        run: |
          flutter pub get
          flutter pub publish --dry-run
          flutter pub publish --force
