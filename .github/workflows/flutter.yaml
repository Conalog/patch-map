name: Flutter

on:
  pull_request:
    branches: [release/1.0]
    paths:
      - packages/flutter/**
      - verification/flutter/**
      - .github/workflows/flutter.yaml
      - package.json
      - docs/engineering/flutter-package.md
  push:
    branches: [release/1.0]
    paths:
      - packages/flutter/**
      - verification/flutter/**
      - .github/workflows/flutter.yaml
      - package.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Analyze, test and validate package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Read SDK pin
        id: sdk
        run: node -e 'const fs = require("node:fs"); const pin = JSON.parse(fs.readFileSync("packages/flutter/.fvmrc", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pin.flutter}\n`);'
      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: false
      - name: Verify Flutter package and extracted consumer
        run: npm run flutter:verify

  native-example:
    name: Build ${{ matrix.platform }} development host
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            runner: ubuntu-latest
          - platform: ios
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - name: Read SDK pin
        id: sdk
        run: node -e 'const fs = require("node:fs"); const pin = JSON.parse(fs.readFileSync("packages/flutter/.fvmrc", "utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${pin.flutter}\n`);'
      - name: Setup Flutter
        uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with:
          flutter-version: ${{ steps.sdk.outputs.version }}
          channel: stable
          cache: false
      - name: Resolve development host
        working-directory: packages/flutter/example
        run: flutter pub get --enforce-lockfile
      - name: Build Android
        if: ${{ matrix.platform == 'android' }}
        working-directory: packages/flutter/example
        run: flutter build apk --debug --no-pub
      - name: Build iOS simulator
        if: ${{ matrix.platform == 'ios' }}
        working-directory: packages/flutter/example
        run: flutter build ios --simulator --debug --no-codesign --no-pub
